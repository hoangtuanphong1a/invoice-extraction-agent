version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-agent-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./invoice_agent.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/invoice_agent.db:/app/invoice_agent.db
      - ./backend/sample_data:/app/sample_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
